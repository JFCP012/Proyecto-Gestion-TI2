<div class="chat-page-container">
  <div class="chat-card">
    <!-- Header del Chat -->
    <header class="chat-header">
      <div class="header-info">
        <div class="avatar-container">
          <span class="bot-icon">🌾</span>
          <span class="status-indicator"></span>
        </div>
        <div>
          <h2>Asistente Agroheno IA</h2>
          <p class="subtitle">Experto en Nutrición Animal y Forrajes</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-header-action" (click)="reiniciarConversacion()"
          title="Reiniciar conversación y borrar historial">
          🧹
        </button>
        <button type="button" class="btn-header-action" (click)="regresar()" title="Regresar a la página anterior">
          ←
        </button>
      </div>
    </header>

    <!-- Sugerencias Rápidas -->
    <div class="quick-suggestions">
      <button class="chip" (click)="enviarSugerencia('¿Qué heno me recomiendas para un caballo de paso?')">
        🐎 Heno para Equinos
      </button>
      <button class="chip" (click)="enviarSugerencia('¿Qué heno es mejor para ganado vacuno?')">
        🐄 Heno para Bovinos
      </button>
      <button class="chip" (click)="enviarSugerencia('¿Cuál heno me recomiendas para mis ovejas?')">
        🐑 Heno para Ovinos
      </button>
    </div>

    <!-- Historial de Mensajes -->
    <div class="chat-body" #chatContainer>
      <div *ngFor="let msg of historialMensajes" class="message-wrapper"
        [ngClass]="{'user-wrapper': msg.sender === 'user', 'bot-wrapper': msg.sender === 'bot'}">
        <div class="message-avatar" *ngIf="msg.sender === 'bot'">
          🌾
        </div>

        <div class="message-bubble"
          [ngClass]="{'user-bubble': msg.sender === 'user', 'bot-bubble': msg.sender === 'bot'}">
          <p class="message-text">{{ msg.text }}</p>
          <span class="message-time">{{ msg.timestamp | date:'shortTime' }}</span>
        </div>

        <div class="message-avatar user-avatar" *ngIf="msg.sender === 'user'">
          👤
        </div>
      </div>

      <!-- Indicador de Cargando (RxJS) -->
      <div class="message-wrapper bot-wrapper" *ngIf="cargando$ | async">
        <div class="message-avatar">🌾</div>
        <div class="message-bubble bot-bubble typing-bubble">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="typing-text">Agroheno IA está pensando...</span>
        </div>
      </div>
    </div>

    <!-- Footer Input del Chat -->
    <footer class="chat-footer">
      <form (submit)="enviarMensaje(); $event.preventDefault();" class="input-form">
        <input type="text" [(ngModel)]="mensajeInput" name="mensaje"
          placeholder="Escribe tu consulta sobre heno y animales..." [disabled]="(cargando$ | async) ?? false"
          autocomplete="off" />
        <button type="submit" class="btn-send" [disabled]="!mensajeInput.trim() || ((cargando$ | async) ?? false)">
          <span class="send-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </span>
        </button>
      </form>
    </footer>
  </div>
</div>
